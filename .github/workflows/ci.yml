# CI proves the app still compiles and passes tests. Code review is a separate,
# human-triggered step: run `/review <PR number>` from Claude Code on the PR
# (or `/code-review ultra <PR number>` for the deeper multi-agent pass).
# Nothing here reviews the diff — an agent must never claim its own PR was
# reviewed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      # Write access is used for exactly one thing: pushing a repaired
      # package-lock.json back to a PR branch. See "Install dependencies".
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR branch itself rather than the detached merge
          # commit, so a repaired lockfile has somewhere to be pushed.
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      # Node 24 ships npm 11, matching the npm that generates package-lock.json
      # locally. See the "//@emnapi" note in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` refuses to install when package-lock.json disagrees with
      # package.json, and the two can disagree purely because of where the lock
      # was generated: npm on Linux expects the peer deps of optional packages
      # in the lockfile, npm on Windows declines to write them. A solo developer
      # on Windows will hit this every time a dependency is added, so CI repairs
      # it instead of just going red.
      - name: Install dependencies
        id: install
        run: |
          if npm ci --no-audit --no-fund; then
            echo "repaired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning title=Lockfile repaired::npm ci rejected the committed package-lock.json. CI regenerated it and carried on; the fix is committed back to this branch."
          npm install --no-audit --no-fund
          echo "repaired=true" >> "$GITHUB_OUTPUT"

      # Only same-repo pull requests: a fork's branch is not ours to write to,
      # and main is not a place to land an unreviewed commit. Pushes made with
      # GITHUB_TOKEN do not trigger another workflow run, so this cannot loop —
      # the current run continues with the repaired tree and still reports on
      # typecheck, lint and tests.
      - name: Commit repaired lockfile
        if: >-
          steps.install.outputs.repaired == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "npm ci failed for some reason other than lockfile drift — nothing to commit."
            echo "### Lockfile untouched" >> "$GITHUB_STEP_SUMMARY"
            echo "\`npm ci\` failed but regenerating did not change package-lock.json, so the cause was something else. Check the install step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): repair package-lock.json for the CI platform" \
                     -m "Regenerated by CI because npm ci rejected the committed lockfile. See the //@emnapi note in package.json for why this happens on Windows." \
                     -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push
          echo "### Lockfile repaired" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npm ci\` rejected the committed lockfile, so CI regenerated it and pushed the fix to this branch. Pull before you commit again." >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit tests
        run: npm test -- --ci
