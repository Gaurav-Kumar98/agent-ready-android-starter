# CI proves the app still compiles and passes tests; CodeRabbit reviews the
# diff. Together they gate every PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, matching the npm that generates package-lock.json
      # locally. See the "//emnapi" note in package.json for the lockfile
      # portability problem this pairs with.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit tests
        run: npm test -- --ci
