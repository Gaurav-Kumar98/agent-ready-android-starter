# CI proves the app still compiles and passes tests; CodeRabbit reviews the
# diff. Together they gate every PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11. This must match the npm that generates
      # package-lock.json locally: npm 10 and npm 11 disagree about whether the
      # peer deps of an *optional* package (the wasm fallback binding that
      # ESLint's resolver pulls in) belong in the lockfile, so a lock written by
      # one fails `npm ci` under the other with "Missing ... from lock file".
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit tests
        run: npm test -- --ci
